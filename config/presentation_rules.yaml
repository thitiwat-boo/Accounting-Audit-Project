version: "2026.1"
effective_date: "2024-01-01"
rules:
  - framework: "TFRS for NPAEs"
    entity_type: "บริษัทจำกัด"
    effective_date: "2024-01-01"
    statement_name: "งบแสดงฐานะการเงิน (แบบ 2 บริษัทจำกัด)"
    required_statements:
      - "งบแสดงฐานะการเงิน"
      - "งบกำไรขาดทุน"
      - "งบแสดงการเปลี่ยนแปลงส่วนของผู้ถือหุ้น"
      - "หมายเหตุประกอบงบการเงิน"
    optional_statements:
      - "งบกระแสเงินสด (จัดทำเพิ่มเติมตามความประสงค์/นโยบายของกิจการ)"
    required_line_items:
      - "เงินสดและรายการเทียบเท่าเงินสด"
      - "ลูกหนี้การค้าและลูกหนี้อื่น"
      - "สินค้าคงเหลือ"
      - "ที่ดิน อาคารและอุปกรณ์"
      - "เจ้าหนี้การค้าและเจ้าหนี้อื่น"
      - "ทุนที่ออกและชำระแล้ว"
      - "กำไรสะสม"
      - "รายได้จากการขายหรือการให้บริการ"
      - "ต้นทุนขายหรือต้นทุนการให้บริการ"
      - "ค่าใช้จ่ายในการขาย"
      - "ค่าใช้จ่ายในการบริหาร"
      - "ต้นทุนทางการเงิน"
      - "ค่าใช้จ่ายภาษีเงินได้"
    optional_line_items:
      - "สินทรัพย์หมุนเวียนอื่น"
      - "เงินลงทุนระยะยาว"
      - "สินทรัพย์ไม่มีตัวตน"
      - "ค่าใช้จ่ายค้างจ่าย"
      - "เงินกู้ยืมระยะยาว"
      - "หนี้สินตามสัญญาเช่า"
      - "ประมาณการหนี้สินไม่หมุนเวียนสำหรับผลประโยชน์พนักงาน"
    current_non_current_rule: "แยกสินทรัพย์หมุนเวียน/ไม่หมุนเวียน และหนี้สินหมุนเวียน/ไม่หมุนเวียน ตามเกณฑ์ 12 เดือนหรือรอบระยะเวลาดำเนินงานปกติ"
    offset_rule: "ห้ามกลบยอดสินทรัพย์กับหนี้สิน หรือรายได้กับค่าใช้จ่าย เว้นแต่ TFRS for NPAEs บทที่ 4 อนุญาต"
    comparative_requirement: "ต้องแสดงข้อมูลเปรียบเทียบอย่างน้อย 1 งวดก่อนหน้า"
    dbd_reference: "ประกาศกรมพัฒนาธุรกิจการค้า เรื่อง กำหนดรายการย่อที่ต้องมีในงบการเงิน พ.ศ. 2566 (แบบ 2)"
    tfac_reference: "TFRS for NPAEs (ปรับปรุง 2565) บทที่ 4"

  - framework: "TFRS for PAEs / TFRS เต็มรูปแบบ"
    entity_type: "บริษัทมหาชนจำกัด"
    effective_date: "2024-01-01"
    statement_name: "งบการเงินฉบับเต็ม (แบบ 3 บริษัทมหาชนจำกัด)"
    required_statements:
      - "งบแสดงฐานะการเงิน"
      - "งบกำไรขาดทุนเบ็ดเสร็จ"
      - "งบแสดงการเปลี่ยนแปลงส่วนของผู้ถือหุ้น"
      - "งบกระแสเงินสด"
      - "หมายเหตุประกอบงบการเงิน"
    optional_statements: []
    required_line_items:
      - "เงินสดและรายการเทียบเท่าเงินสด"
      - "ลูกหนี้การค้าและลูกหนี้อื่น"
      - "สินค้าคงเหลือ"
      - "สินทรัพย์หมุนเวียนอื่น"
      - "ที่ดิน อาคารและอุปกรณ์"
      - "สินทรัพย์ไม่มีตัวตน"
      - "เจ้าหนี้การค้าและเจ้าหนี้อื่น"
      - "หนี้สินตามสัญญาเช่า"
      - "ประมาณการหนี้สินไม่หมุนเวียนสำหรับผลประโยชน์พนักงาน"
      - "ทุนที่ออกและชำระแล้ว"
      - "กำไรสะสม"
      - "รายได้จากการขายหรือการให้บริการ"
      - "ต้นทุนขายหรือต้นทุนการให้บริการ"
      - "ค่าใช้จ่ายในการขาย"
      - "ค่าใช้จ่ายในการบริหาร"
      - "ต้นทุนทางการเงิน"
      - "ค่าใช้จ่ายภาษีเงินได้"
    optional_line_items:
      - "กำไรขาดทุนเบ็ดเสร็จอื่น (OCI)"
    current_non_current_rule: "TAS 1 การนำเสนองบการเงิน: แยกหมุนเวียนและไม่หมุนเวียน (Liquidity presentation เฉพาะสถาบันการเงิน)"
    offset_rule: "TAS 1 ย่อหน้า 32: ห้ามหักกลบสินทรัพย์และหนี้สิน หรือรายได้และค่าใช้จ่าย เว้นแต่มาตรฐานกำหนด"
    comparative_requirement: "ต้องแสดงงวดเปรียบเทียบครบทุกงบและหมายเหตุประกอบงบการเงิน (รวมงบฐานะการเงินต้นงวดกรณีปรับย้อนหลัง)"
    dbd_reference: "ประกาศกรมพัฒนาธุรกิจการค้า เรื่อง กำหนดรายการย่อที่ต้องมีในงบการเงิน พ.ศ. 2566 (แบบ 3)"
    tfac_reference: "TAS 1 / TAS 7 / TFRS 9 / TFRS 15 / TFRS 16"

